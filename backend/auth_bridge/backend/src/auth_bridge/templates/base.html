<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}LostFilm — вход на телевизоре{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: #040a11; color: #f7f1e8; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; background: #0b1521;
      border: 1px solid #ffffff20; border-radius: 24px; }
    .brand { color: #d7aa5d; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 28px 0 16px; }
    p { color: #d2d9e2; } .code { font-size: 28px; color: #d7aa5d; letter-spacing: 5px; font-weight: 700; }
    a { display: block; margin-top: 28px; padding: 14px 20px; background: #d7aa5d;
      color: #17110a; border-radius: 12px; text-align: center; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #f7f1e8; outline-offset: 4px; }
    .note { margin-top: 24px; font-size: 13px; color: #8793a3; }
    @media (max-width: 360px) { main { padding: 22px; } }
  </style>
</head>
<body><main><div class="brand">LOSTFILM / TV</div>{% block content %}{% endblock %}</main></body>
</html>
