{% extends "base.html" %}
{% block title %}Phone sign-in error — LostFilm{% endblock %}
{% block content %}
<h1>Не удалось завершить вход</h1>
<p>{{ message }}</p>
{% if retry_url %}<a href="{{ retry_url }}">Попробовать ещё раз</a>{% endif %}
<p class="note">Если ошибка повторяется, получите новый QR-код на телевизоре.</p>
{% endblock %}
