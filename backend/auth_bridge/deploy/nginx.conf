server {
    listen 80;
    listen [::]:80;
    server_name lost.hagenka.online;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lostfilm-acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lost.hagenka.online;
    ssl_certificate /etc/letsencrypt/live/lost.hagenka.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lost.hagenka.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:18015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_redirect off;
    }
}
